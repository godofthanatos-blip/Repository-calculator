    <script>
        // State variables
        let currentAsset = 'GOLD'; // 'GOLD' or 'NASDAQ'
        let currentPosition = 'BUY'; // 'BUY' or 'SELL'

        // Preset configuration
        const CONFIG = {
            GOLD: {
                targetOffset: 1.00,
                unitName: '$',
                tickValuePerContract: 100, // $1 = $100 per contract
                decimals: 2,
                placeholder: '2000.00'
            },
            NASDAQ: {
                targetOffset: 10.00,
                unitName: 'pt',
                tickValuePerContract: 20, // 1pt = $20 per contract
                decimals: 2,
                placeholder: '18000.00'
            }
        };

        // Switch Asset (Gold vs Nasdaq)
        function setAsset(asset) {
            currentAsset = asset;
            const goldBtn = document.getElementById('assetGold');
            const nasdaqBtn = document.getElementById('assetNasdaq');

            if (asset === 'GOLD') {
                goldBtn.className = "py-2 px-3 rounded-xl text-xs font-bold transition flex items-center justify-center gap-2 bg-amber-500/20 text-amber-400 border border-amber-500/50 shadow-sm";
                nasdaqBtn.className = "py-2 px-3 rounded-xl text-xs font-bold transition flex items-center justify-center gap-2 text-slate-400 hover:text-slate-200 border border-transparent";
            } else {
                nasdaqBtn.className = "py-2 px-3 rounded-xl text-xs font-bold transition flex items-center justify-center gap-2 bg-blue-500/20 text-blue-400 border border-blue-500/50 shadow-sm";
                goldBtn.className = "py-2 px-3 rounded-xl text-xs font-bold transition flex items-center justify-center gap-2 text-slate-400 hover:text-slate-200 border border-transparent";
            }

            // Update placeholders
            for (let i = 0; i < 6; i++) {
                document.getElementById(`price-${i}`).placeholder = CONFIG[asset].placeholder;
            }

            calculate();
        }

        // Switch Position (Buy vs Sell)
        function setPosition(pos) {
            currentPosition = pos;
            const buyBtn = document.getElementById('posBuy');
            const sellBtn = document.getElementById('posSell');
            const targetCard = document.getElementById('targetCard');

            if (pos === 'BUY') {
                buyBtn.className = "py-2 px-3 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 bg-emerald-500/20 text-emerald-400 border border-emerald-500/50 shadow-sm";
                sellBtn.className = "py-2 px-3 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 text-slate-400 hover:text-slate-200 border border-transparent";
                
                targetCard.className = "bg-gradient-to-br from-emerald-950/40 to-slate-900 p-3 rounded-2xl border border-emerald-500/30";
            } else {
                sellBtn.className = "py-2 px-3 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 bg-rose-500/20 text-rose-400 border border-rose-500/50 shadow-sm";
                buyBtn.className = "py-2 px-3 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 text-slate-400 hover:text-slate-200 border border-transparent";
                
                targetCard.className = "bg-gradient-to-br from-rose-950/40 to-slate-900 p-3 rounded-2xl border border-rose-500/30";
            }

            calculate();
        }

        // Calculation Core Logic
        function calculate() {
            const assetConfig = CONFIG[currentAsset];
            let cumulativeValue = 0;
            let cumulativeQty = 0;

            // Iterate through all 6 entries (0 to 5)
            for (let i = 0; i < 6; i++) {
                const priceInput = document.getElementById(`price-${i}`);
                const qtyInput = document.getElementById(`qty-${i}`);
                const stepAvgBadge = document.getElementById(`stepAvg-${i}`);

                const price = parseFloat(priceInput.value);
                const qty = parseFloat(qtyInput.value) || 0;

                if (!isNaN(price) && price > 0 && qty > 0) {
                    cumulativeValue += price * qty;
                    cumulativeQty += qty;
                    
                    const currentAvg = cumulativeValue / cumulativeQty;
                    stepAvgBadge.innerText = `누적평단: ${currentAvg.toFixed(assetConfig.decimals)}`;
                    stepAvgBadge.className = "text-[11px] font-semibold text-slate-300";
                } else {
                    stepAvgBadge.innerText = `-`;
                    stepAvgBadge.className = "text-[11px] text-slate-500";
                }
            }

            // Update Header & Card Displays
            const avgDisplay = document.getElementById('avgPriceDisplay');
            const targetDisplay = document.getElementById('targetPriceDisplay');
            const targetOffsetBadge = document.getElementById('targetOffsetBadge');
            const totalContractsBadge = document.getElementById('totalContractsBadge');
            const targetProfitDisplay = document.getElementById('targetProfitDisplay');

            const targetSign = currentPosition === 'BUY' ? '+' : '-';
            targetOffsetBadge.innerText = `${targetSign}${assetConfig.targetOffset.toFixed(2)}${assetConfig.unitName}`;

            if (cumulativeQty > 0) {
                const avgPrice = cumulativeValue / cumulativeQty;
                let targetPrice = 0;

                if (currentPosition === 'BUY') {
                    targetPrice = avgPrice + assetConfig.targetOffset;
                } else {
                    targetPrice = avgPrice - assetConfig.targetOffset;
                }

                // Calculate Profit Amount in USD
                const totalProfitUsd = cumulativeQty * assetConfig.targetOffset * assetConfig.tickValuePerContract;

                avgDisplay.innerText = avgPrice.toFixed(assetConfig.decimals);
                targetDisplay.innerText = targetPrice.toFixed(assetConfig.decimals);
                totalContractsBadge.innerText = `${cumulativeQty} 계약`;
                
                // Color scheme adjustments for targets
                if (currentPosition === 'BUY') {
                    targetDisplay.className = "text-lg font-extrabold text-emerald-400 mt-1 tracking-tight";
                    targetOffsetBadge.className = "text-[10px] font-semibold text-emerald-400/80";
                    targetProfitDisplay.className = "font-bold text-emerald-400";
                } else {
                    targetDisplay.className = "text-lg font-extrabold text-rose-400 mt-1 tracking-tight";
                    targetOffsetBadge.className = "text-[10px] font-semibold text-rose-400/80";
                    targetProfitDisplay.className = "font-bold text-rose-400";
                }

                targetProfitDisplay.innerText = `+${assetConfig.targetOffset.toFixed(2)} ${assetConfig.unitName} (약 $${totalProfitUsd.toLocaleString()})`;

            } else {
                avgDisplay.innerText = "0.00";
                targetDisplay.innerText = "0.00";
                totalContractsBadge.innerText = "0 계약";
                targetProfitDisplay.innerText = "+0.00 pt ($0)";
                targetDisplay.className = "text-lg font-extrabold text-slate-400 mt-1 tracking-tight";
            }
        }

        // Reset all input fields
        function resetAll() {
            for (let i = 0; i < 6; i++) {
                document.getElementById(`price-${i}`).value = '';
                document.getElementById(`qty-${i}`).value = (i === 0) ? '1' : '';
            }
            calculate();
        }

        // Initial launch calculation on window load
        window.onload = function() {
            calculate();
        };
    </script>
</body>
